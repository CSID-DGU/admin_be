name: CI/CD to On-Prem Kubernetes with Helm

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:  # 코드 변경 없이 Secret 값만 바뀌었을 때도 수동으로 재배포할 수 있도록

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: 📦 소스 코드 체크아웃
        uses: actions/checkout@v7

      - name: ☕️ JDK 17 설정
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 설정 파일은 이미지에 넣지 않는다. 운영 설정은 배포 단계에서 차트의 admin-prod-config Secret으로
      # 만들어 /app/config/application.yml에 마운트한다(Spring Boot가 jar 안 설정보다 우선해서 읽는 위치).
      - name: ⚡ Gradle Build (테스트 제외)
        run: ./gradlew build -x test

      - name: 🐳 Docker Build & Push to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker build -t ${{ secrets.DOCKER_USERNAME }}/admin-prod:latest -t ${{ secrets.DOCKER_USERNAME }}/admin-prod:${{ github.sha }} .
          docker push ${{ secrets.DOCKER_USERNAME }}/admin-prod:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/admin-prod:${{ github.sha }}
          docker logout

  deploy:
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: 📦 차트 체크아웃
        uses: actions/checkout@v7

      # 배포 서버에 따로 두던 차트 사본(/opt/admin_be/helm/admin-prod) 대신 레포의 차트를 쓴다.
      - name: 📤 Helm 차트를 서버로 복사
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.K8S_HOST }}
          port: ${{ secrets.K8S_PORT }}
          username: ${{ secrets.K8S_USERNAME }}
          key: ${{ secrets.K8S_PRIVATE_KEY }}
          source: "helm/admin-prod"
          target: "~/deploy-temp-admin"
          rm: true

      - name: 🚀 Helm을 통한 쿠버네티스 배포
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.K8S_HOST }}
          port: ${{ secrets.K8S_PORT }}
          username: ${{ secrets.K8S_USERNAME }}
          key: ${{ secrets.K8S_PRIVATE_KEY }}
          script: |
            set -e # 실패 시 즉시 중단
            export KUBECONFIG=/etc/kubernetes/ci-deployer.conf

            echo "✅ 쿠버네티스 연결 테스트"
            kubectl get nodes

            echo "📦 Helm 차트 배포 (레포 차트, 커밋 SHA 태그)"
            # 이미지를 커밋 SHA로 지정해야 되돌릴 때 정확히 직전 이미지로 돌아간다(latest는 이미 새 이미지를 가리킴).
            if ! helm upgrade --install admin-prod ~/deploy-temp-admin/helm/admin-prod \
              --namespace default \
              --create-namespace \
              --set image.repository=${{ secrets.DOCKER_USERNAME }}/admin-prod \
              --set image.tag=${{ github.sha }} \
              --set env.application="$(echo "${{ secrets.APPLICATION }}" | base64 -w 0)" \
              --set args[0]="--spring.profiles.active=prod" \
              --set forceReload=$(date +%s) \
              --wait --timeout 10m; then
              echo "❌ 새 버전이 준비 상태에 이르지 못해 직전 버전으로 되돌립니다"
              helm rollback admin-prod --namespace default --wait --timeout 10m
              exit 1
            fi

            echo "🎉 배포 완료!"

name: Sync Application Secret to K8s

on:
  workflow_dispatch:  # APPLICATION secret 값만 바뀌었을 때 수동 실행. 이미지 빌드·default/admin-prod 재배포는 하지 않는다(2026-09-15부로 운영 0개 축소, 되살리지 않음)

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: 🔑 default/admin-prod-config Secret만 패치
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.K8S_HOST }}
          port: ${{ secrets.K8S_PORT }}
          username: ${{ secrets.K8S_USERNAME }}
          key: ${{ secrets.K8S_PRIVATE_KEY }}
          envs: APPLICATION
          script: |
            set -e
            export KUBECONFIG=/etc/kubernetes/ci-deployer.conf
            kubectl -n default patch secret admin-prod-config --type merge \
              -p "{\"data\":{\"application.yml\":\"$(echo "$APPLICATION" | base64 -w 0)\"}}"
            echo "✅ default/admin-prod-config 패치 완료 (Deployment는 건드리지 않음)"
        env:
          APPLICATION: ${{ secrets.APPLICATION }}

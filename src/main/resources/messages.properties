email.container.created.subject=[DGU AI LAB] 서버가 준비됐어요 ({0})
email.container.created.password-notice=웹사이트 로그인 비밀번호와 같아요 (보안을 위해 메일에는 적지 않아요)

# {0}: \uC774\uB984, {1}: \uC774\uBBF8\uC9C0:\uBC84\uC804, {2}: username, {3}: SSH \uD3EC\uD2B8, {4}: Jupyter \uD3EC\uD2B8, {5}: \uC811\uC18D IP, {6}: \uBE44\uBC00\uBC88\uD638 \uC548\uB0B4 \uBB38\uAD6C(email.container.created.password-notice \u2014 \uBE44\uBC00\uBC88\uD638 \uC790\uCCB4\uB294 \uC800\uC7A5\uD558\uC9C0 \uC54A\uC544 \uB123\uC744 \uC218 \uC5C6\uC74C), {7}: \uCD94\uAC00 \uD3EC\uD2B8
# \uD3EC\uD2B8\uB294 \uBB38\uC790\uC5F4\uB85C \uC804\uB2EC(\uC22B\uC790\uD615\uC774\uBA74 MessageFormat\uAC00 30,888\uCC98\uB7FC \uCF64\uB9C8\uB97C \uB123\uC74C)
email.container.created.body=안녕하세요, {0}님.\n\
  \n\
  신청하신 서버가 준비됐어요. 아래 순서대로 접속해 보세요.\n\
  \n\
  [접속 정보]\n\
  - 아이디: {2}\n\
  - 비밀번호: {6}\n\
  - 서버 주소: {5}\n\
  - SSH 포트: {3}\n\
  - JupyterLab 포트: {4}\n\
  - 추가 포트: {7}\n\
  - 개발 환경: {1}\n\
  \n\
  [방법 1] 터미널로 접속하기 (SSH)\n\
  1. 터미널을 열어요. (Windows는 PowerShell, Mac은 터미널)\n\
  2. 아래 명령어를 그대로 붙여 넣고 Enter를 눌러요.\n\
  ssh -p {3} {2}@{5}\n\
  3. 처음 접속하면 yes/no를 물어요. yes를 입력하고 Enter를 눌러요.\n\
  4. 비밀번호를 입력하고 Enter를 눌러요. 입력하는 동안 화면에 글자가 보이지 않는 게 정상이에요.\n\
  \n\
  [방법 2] 웹 브라우저로 접속하기 (JupyterLab)\n\
  1. 브라우저 주소창에 아래 주소를 입력해요.\n\
  http://{5}:{4}\n\
  2. 처음 한 번은 token(접속 키)을 물어요. 방법 1로 접속한 뒤 아래 명령어를 입력하면 token이 나와요.\n\
  cat /home/{2}/decs_jupyter_lab/jupyter_token.txt\n\
  3. 나온 token을 붙여 넣고, 안내에 따라 JupyterLab 비밀번호를 새로 정해요. 다음부터는 그 비밀번호로 들어가요.\n\
  \n\
  [꼭 알아 두세요]\n\
  - 서버 비밀번호는 웹사이트 로그인 비밀번호와 같아요. 웹사이트에서 비밀번호를 바꾸면 서버 비밀번호도 같이 바뀌어요.\n\
  - 파일은 홈 폴더(/home/{2})에 저장해 주세요. 홈 폴더 밖의 파일은 사용 기간이 끝나면 지워져요.\n\
  - 서버는 파일을 백업하지 않아요. 중요한 파일은 내 컴퓨터에도 따로 저장해 두세요.\n\
  \n\
  [사용 설명서]\n\
  - https://docs.google.com/presentation/d/1tu9vUQRd0HBaVrwPLDzo0QJ5vEg4FnjI/edit?usp=sharing&ouid=104298167984129919697&rtpof=true&sd=true\n\
  \n\
  [문제가 생기면]\n\
  1. 먼저 사용 설명서에서 같은 문제가 있는지 찾아봐요.\n\
  2. 그래도 안 되면 문의 폼으로 알려 주세요.\n\

  - 서버 주소: {5}\n\
  - SSH 포트: {3}\n\
  - JupyterLab 포트: {4}\n\
  - 추가 포트: {7}\n\
  - 개발 환경: {1}\n\
  \n\
  [방법 1] 터미널로 접속하기 (SSH)\n\
  1. 터미널을 열어요. (Windows는 PowerShell, Mac은 터미널)\n\
  2. 아래 명령어를 그대로 붙여 넣고 Enter를 눌러요.\n\
  ssh -p {3} {2}@{5}\n\
  3. 처음 접속하면 yes/no를 물어요. yes를 입력하고 Enter를 눌러요.\n\
  4. 비밀번호를 입력하고 Enter를 눌러요. 입력하는 동안 화면에 글자가 보이지 않는 게 정상이에요.\n\
  \n\
  [방법 2] 웹 브라우저로 접속하기 (JupyterLab)\n\
  1. 브라우저 주소창에 아래 주소를 입력해요.\n\
  http://{5}:{4}\n\
  2. 처음 한 번은 token(접속 키)을 물어요. 방법 1로 접속한 뒤 아래 명령어를 입력하면 token이 나와요.\n\
  cat /home/{2}/decs_jupyter_lab/jupyter_token.txt\n\
  3. 나온 token을 붙여 넣고, 안내에 따라 JupyterLab 비밀번호를 새로 정해요. 다음부터는 그 비밀번호로 들어가요.\n\
  \n\
  [꼭 알아 두세요]\n\
  - 서버 비밀번호는 웹사이트 로그인 비밀번호와 같아요. 웹사이트에서 비밀번호를 바꾸면 서버 비밀번호도 같이 바뀌어요.\n\
  - 파일은 홈 폴더(/home/{2})에 저장해 주세요. 홈 폴더 밖의 파일은 사용 기간이 끝나면 지워져요.\n\
  - 서버는 파일을 백업하지 않아요. 중요한 파일은 내 컴퓨터에도 따로 저장해 두세요.\n\
  \n\
  [사용 설명서]\n\
  - https://docs.google.com/presentation/d/1tu9vUQRd0HBaVrwPLDzo0QJ5vEg4FnjI/edit?usp=sharing&ouid=104298167984129919697&rtpof=true&sd=true\n\
  \n\
  [문제가 생기면]\n\
  1. 먼저 사용 설명서에서 같은 문제가 있는지 찾아봐요.\n\
  2. 그래도 안 되면 문의 폼으로 알려 주세요.\n\
  - 문의 폼: https://forms.gle/nACaxj2UeJF56V2i7\n\
  - 오류 메시지, 오류가 난 시각, 무엇을 하다가 오류가 났는지 함께 적어 주세요.\n\
  - 폼에 적은 내용은 Slack ''오류신고및문의'' 채널에 올라가요. 채널 알림을 켜 두고, 관리자가 물어보면 12시간 안에 답해 주세요.\n\
  - 관리자에게 개인 메시지(Slack DM, 카카오톡 등)로 연락하면 답을 드리지 않아요. 꼭 문의 폼을 써 주세요.\n\
  \n\
  [지켜 주세요]\n\
  - 설명서를 읽지 않았거나 관리자 요청에 답하지 않아서 생긴 문제는 본인이 책임져야 해요.\n\
  - 설명서를 확인하지 않고 같은 신고를 반복하면 지도교수님께 알리고, 계정 사용을 막을 수 있어요.


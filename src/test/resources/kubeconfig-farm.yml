apiVersion: v1
kind: Config
clusters:
  - name: farm
    cluster:
      server: https://127.0.0.1:16443
      insecure-skip-tls-verify: true
users:
  - name: farm-admin
    user:
      token: test-farm-kubernetes-token
contexts:
  - name: farm
    context:
      cluster: farm
      user: farm-admin
current-context: farm

apiVersion: v1
kind: Config
clusters:
  - name: lab
    cluster:
      server: https://127.0.0.1:17443
      insecure-skip-tls-verify: true
users:
  - name: lab-admin
    user:
      token: test-lab-kubernetes-token
contexts:
  - name: lab
    context:
      cluster: lab
      user: lab-admin
current-context: lab

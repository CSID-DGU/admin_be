# ~/admin_be/helm/admin-prod/templates/secret.yaml
#
# 운영 application.yml. CI가 GitHub 시크릿 APPLICATION을 base64로 env.application에 넣는다.
# 컨테이너의 /app/config/application.yml로 마운트되며, Spring Boot는 이 위치(file:./config/)를
# jar 안의 설정보다 우선해서 읽는다.
{{- if .Values.env.application }}
apiVersion: v1
kind: Secret
metadata:
  name: admin-prod-config
type: Opaque
data:
  application.yml: {{ .Values.env.application | quote }}
{{- end }}

{{- if .Values.rbac.create }}
# 이 권한은 배포 서버의 차트 사본에 없어 한 번도 helm으로 배포된 적이 없다. 운영 상태를 확인한 뒤 켠다.
# ~/admin_be/helm/admin-prod/templates/rbac.yaml
#
# PodQueryService(KubernetesClient)가 /api/admin/pods/**에서 ailab-infra 네임스페이스의
# Pod를 직접 조회한다(namespace/hostIP/creationTimestamp 등). admin-prod ServiceAccount에
# 아무 RBAC도 없어서 이 조회가 매번 403으로 실패해 프론트에 "—"로만 표시되던 문제 수정.
#
# events 리소스도 같은 이유로 필요하다 — PodQueryService.getPodEvents가
# client.v1().events().inNamespace(...).list()로 Pod 이벤트를 조회하는데, 이 권한이
# 빠져있어 이벤트 패널이 403으로 계속 실패하던 문제도 함께 수정.
#
# pods/log는 pods와 별개의 서브리소스라 pods 권한만으로는 로그 조회(getPodLogs)가
# 계속 403으로 실패한다 — 컨테이너 상세 페이지의 로그 탭이 항상 빈 화면으로 보이던
# 원인이 이것이었다 (#... 마이그레이션된 pod 로그/이벤트 조회 실패 건).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: admin-prod-pod-reader
  namespace: ailab-infra
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: admin-prod-pod-reader-binding
  namespace: ailab-infra
subjects:
  - kind: ServiceAccount
    name: admin-prod
    namespace: default
roleRef:
  kind: Role
  name: admin-prod-pod-reader
  apiGroup: rbac.authorization.k8s.io
{{- end }}
